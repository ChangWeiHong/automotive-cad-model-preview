# Fly.io app running the CAD Viewer. Deploy from the repo root with
# scripts/deploy.sh (creates the app and the cache volume when missing).
app = "awantech-cad-viewer"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # stay up for the demo: no cold starts
  auto_start_machines = true
  min_machines_running = 1

# Persistent cache: survives restarts and redeploys, never evicted.
[[mounts]]
  source = "cad_cache"
  destination = "/data"

[[vm]]
  memory = "8gb"
  cpu_kind = "performance"
  cpus = 4
